# Infra only (apps run on the host); non-default ports avoid clashes with other projects.
name: uber-clone

services:
  # One container; each service with a database gets its own database and login role.
  postgres:
    image: postgres:latest
    container_name: ub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ub
      POSTGRES_PASSWORD: ub
    ports:
      - "5455:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs only when the data volume is empty (first start or after reset:pods).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ub -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Driver locations (GEO), driver state, matching jobs, quotes, surge counters. All rebuildable.
  redis:
    image: redis:6.2.24
    container_name: ub-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6401:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Trip event log. Single KRaft node: broker and controller, no ZooKeeper.
  kafka:
    image: bitnami/kafka:3.5.1
    container_name: ub-kafka
    restart: unless-stopped
    environment:
      KAFKA_KRAFT_CLUSTER_ID: 2wZ8m1qURcO5c8lD3kQ7Vg
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers, EXTERNAL (localhost:9205) for services on the host.
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9205
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9205
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are created on purpose by kafka-setup, never by a typo in a client.
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9205:9205"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot: creates topics, then exits. The trip id key keeps one trip's events in order.
  kafka-setup:
    image: bitnami/kafka:3.5.1
    container_name: ub-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ub.trip-events
      --partitions 3 --replication-factor 1 &&
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ub.trip-events.dlt
      --partitions 1 --replication-factor 1 --config retention.ms=1209600000 &&
      echo 'Topics ready: ub.trip-events (3 partitions) and ub.trip-events.dlt'
      "

volumes:
  postgres-data:
  kafka-data:
